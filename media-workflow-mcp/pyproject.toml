[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "media-workflow-mcp"
version = "0.1.0"
description = "Generic MCP service for media probing, boundary-frame extraction, concatenation, and audio muxing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4",
  "anyio>=4,<5",
  "mcp>=2.1.1,<3",
  "pydantic>=2.11,<3",
  "jsonschema>=4.23,<5",
  "uvicorn>=0.35,<1",
]

[project.scripts]
media-workflow-mcp = "media_workflow_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_workflow_mcp"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
